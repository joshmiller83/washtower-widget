# Generate WashTowerWidget.xcodeproj with `xcodegen generate` (brew install xcodegen).
# The generated project is committed too, so XcodeGen is only needed to change targets.
name: WashTowerWidget
options:
  deploymentTarget:
    macOS: "14.0"
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  WashTowerWidget:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_NAME: WashTower Widget
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).WashTowerWidget
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: WashTowerWidgetExtension
  WashTowerWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_NAME: WashTowerWidgetExtension
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).WashTowerWidget.Widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  # iPhone app: pairs with the relay (Relay/) and hosts the Live Activity.
  WashTower:
    type: application
    platform: iOS
    sources:
      - iOS/App
      - iOS/Shared
      - Shared/LaundryModels.swift
      - Shared/LiveActivityState.swift
      - Shared/DrumStyle.swift
    settings:
      base:
        PRODUCT_NAME: WashTower
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).WashTower
        INFOPLIST_FILE: iOS/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/App/WashTower.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: WashTowerLiveActivity
  WashTowerLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - iOS/LiveActivity
      - iOS/Shared
      - Shared/LaundryModels.swift
      - Shared/LiveActivityState.swift
      - Shared/DrumStyle.swift
    settings:
      base:
        PRODUCT_NAME: WashTowerLiveActivity
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).WashTower.LiveActivity
        INFOPLIST_FILE: iOS/LiveActivity/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
schemes:
  WashTowerWidget:
    build:
      targets:
        WashTowerWidget: all
    run:
      config: Debug
    archive:
      config: Release
  WashTower:
    build:
      targets:
        WashTower: all
    run:
      config: Debug
    archive:
      config: Release
